components:
  securitySchemes:
    bearerAuth:
      type: http
      description: >-
        You should use the token obtained from the /authorization/oauth/token
        endpoint.
      scheme: bearer
      bearerFormat: JWT
    basicAuth:
      type: http
      scheme: basic
  schemas:
    authorizationRequest:
      type: object
      title: AuthorizationServiceRequest
      required:
        - client_id
        - client_secret
        - grant_type
      properties:
        grant_type:
          type: string
          enum:
            - client_credentials
            - payment_intents
          description: |-
            Possible values:
              - client_credentials: Pass this for all standard integrations.
              - payment_intents: Pass this if you are requesting a short lived OAuth token for payment intents. Applicable only for the mobile SDK integration
        client_id:
          type: string
          description: Client ID provided by Axepta Online. This is your merchant ID
        client_secret:
          type: string
          description: Client secret provided by Axepta Online. This is your API key
        payment_intent_id:
          type: string
    authorizationResponse:
      type: object
      title: AuthorizationServiceResponse
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
            - bearer
        expires_in:
          type: number
          description: Token expiry time in seconds
    authorizationValidationErrorResponse:
      type: object
      title: ValidationErrorResponse
      properties:
        error:
          type: string
          example: Invalid payment_intent_id
    unauthorizedErrorResponse:
      type: object
      title: UnauthorizedResponse
      required:
        - client_id
        - client_secret
        - grant_type
      properties:
        error:
          type: string
          example: unsupported_grant_type
        error_description:
          type: string
          example: The specified 'grant_type' is not supported.
        error_uri:
          type: string
          example: https://documentation.openiddict.com/errors/ID2032
    serverErrorResponse:
      type: object
      properties:
        responseCode:
          type: string
          example: A specific identifier for the error cause
        responseDescription:
          type: string
          example: A brief message explaining the error
    amount:
      type: object
      required:
        - currency
        - value
      properties:
        value:
          type: number
          description: >-
            Total order amount in the smallest currency unit, including taxes,
            shipping costs, discounts, etc.
        currency:
          type: string
          description: 3-character ISO currency code.
        taxTotal:
          type: number
          description: Total tax amount.
        netItemTotal:
          type: number
          description: >-
            Total net amount of the products as part of the order, excluding
            shipping costs.
        netShippingAmount:
          type: number
          description: Net shipping costs.
        grossShippingAmount:
          type: number
          description: Gross shipping costs.
        netDiscount:
          type: number
          description: Net discount amount.
        grossDiscount:
          type: number
          description: Gross discount amount.
    customFields:
      type: object
      description: >-
        Customizable fields that can store additional data or display specific
        information on the Hosted Payment Page template.
      properties:
        customField1:
          type: string
          description: >-
            Customizable fields that can store additional data or display
            specific information on a card template.
        customField2:
          type: string
          description: >-
            Customizable fields that can store additional data or display
            specific information on a card template.
        customField3:
          type: string
          description: >-
            Customizable fields that can store additional data or display
            specific information on a card template.
        customField4:
          type: string
          description: >-
