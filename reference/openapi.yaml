                - DHL_PACKSTATION
                - DIGITAL
                - UNDEFINED
                - PICK_UP_WAREHOUSE
                - CLICK_COLLECT
                - PALLET_DELIVERY_PICK_UP_POINT
                - PALLET_DELIVERY
