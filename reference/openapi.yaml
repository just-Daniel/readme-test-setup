    template:
      type: object
      properties:
        name:
          type: string
          description: Name of template to customize the Hosted Payment Page.
        customFields:
          $ref: '#/components/schemas/customFields'
    captureMethod:
      title: captureMethod
      type: object
      properties:
        type:
          type: string
          description: Specifies the type of capture method being used.
          enum:
            - AUTOMATIC
            - MANUAL
            - DELAYED
        delayed:
          type: object
          properties:
            delayedHours:
              description: >-
                Defines the delay period, in hours, before an authorized payment
                is automatically captured. Required if type is delayed. Minimum:
                1, maximum: 696
              type: number
              minimum: 1
              maximum: 696
    credentialOnFile:
      title: credentialOnFile
      type: object
      properties:
        type:
          type: string
          enum:
            - RECURRING
            - UNSCHEDULED
            - INSTALLMENTS
          description: Indicates the type of credential-on-file transaction.
        initialPayment:
          type: boolean
          description: >-
            Specifies whether the transaction is the initial payment in a
            credential-on-file setup.
        recurring:
          type: object
          properties:
            useCase:
              type: string
              description: Describes the use case for the unscheduled transaction.
              enum:
                - FIXED
                - FLEXIBLE_AMOUNT
                - FLEXIBLE_FREQUENCY
            frequency:
              type: string
              description: Defines the frequency of recurring payments.
              enum:
                - DAILY
                - WEEKLY
                - MONTHLY
                - YEARLY
            startDate:
              type: string
              format: date
              description: >-
                The date when the recurring payment schedule begins in
                YYYY-MM-DD format.
            expiryDate:
              type: string
              format: date
              description: >-
                The date when the recurring payment schedule ends or expires in
                YYYY-MM-DD format.
        unscheduled:
          type: object
          properties:
            subType:
              type: string
              description: >-
                Specifies the sub-type of an unscheduled credential-on-file
                transaction.
              enum:
                - CIT
                - MIT
        installments:
          type: object
          properties:
            total:
              type: number
              description: Total number of installments for a purchase.
            curIdx:
              type: number
              description: >-
                The index or sequence number of the current installment in the
                series.
            purchaseAmount:
              type: number
              description: The total purchase amount being paid in installments.
            frequency:
              type: string
              description: >-
                The frequency of installment payments, such as "daily",
                "weekly", "monthly", or "yearly".
              enum:
                - DAILY
                - WEEKLY
                - BIWEEKLY
                - MONTHLY
                - BIMONTHLY
                - QUARTERLY
                - YEARLY
            expiryDate:
              type: string
              format: date
              description: >-
                The date when the installment plan ends or expires in YYYY-MM-DD
                format.
    productInfo:
      type: object
      properties:
        brand:
          type: string
          description: The brand name associated with this product.
        categories:
          type: array
          description: The product's category path as used in the your webshop
          items:
            type: string
        globalTradeItemNumber:
          type: string
          description: The product's Global Trade Item Number (GTIN).
          enum:
            - EAN
            - ISBN
            - UPC
        manufacturerPartNumber:
          type: string
          description: >-
            The product's Manufacturer Part Number (MPN), which - together with
            the brand - uniquely identifies a product. Only submit MPNs assigned
            by a manufacturer and use the most specific MPN possible.
        imageUrl:
          type: string
          format: uri
          description: A URL pointing to an image of this product.
        productUrl:
          type: string
          format: uri
          description: A URL linking to a detailed product page on the merchant's website.
    order:
      type: object
      properties:
        merchantReference:
          type: string
          description: A unique identifier for the order, assigned by your system.
        numberOfArticles:
          type: number
          description: The total number of articles (items) included in the order.
        description:
          type: string
          description: >-
            A short, description of the order (e.g. main product or order
            summary).
        creationDate:
          type: string
          format: date-time
          description: The date and time when the order was created.
        invoiceId:
          type: string
          description: ID of the invoice generated for the order.
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: A unique identifier for the specific item in the order.
              sku:
                type: string
                description: >-
                  The Stock Keeping Unit (SKU) of the item, used to uniquely
                  identify the product within the merchant's inventory.
              name:
                type: string
                description: The name or title of the item being purchased.
              type:
                type: string
                description: >-
                  The type of item, such as "physical", "digital", "discount",
                  "sales_tax", "shipping_fee", "discount", "gift_card",
                  "store_credit", etc.
              quantity:
                type: number
                description: The quantity of this item being purchased in the order.
              quantityUnit:
                type: string
                description: >-
                  The unit of measurement for the quantity, such as "pcs", "kg",
                  or "liters".
              taxRate:
                type: number
                description: >-
                  The tax rate applied to this item. Percentage sign must be
                  replaced with two zeros. For example: A tax rate of 25% should
                  be sent as 2500.
              netPrice:
                type: number
                description: >-
                  The net price of a single unit of this item, excluding tax and
                  discounts.
              grossPrice:
                type: number
                description: >-
                  The gross price of a single unit of this item, including taxes
                  but excluding discounts.
              discountAmount:
                type: number
                description: Discount amount applied to single unit of this item.
              taxAmount:
                type: number
                description: Tax amount applied to single unit of this item.
              merchantData:
                type: string
                description: >-
                  Additional data or metadata provided by the merchant about
                  this item.
              description:
                type: string
                description: Detailed description of the item.
              marketplaceSellerId:
                type: string
                description: An identifier for the seller in a marketplace context.
              lineNumber:
                type: number
                description: >-
                  A sequential line number assigned to this item in the order
                  for reference purposes.
              merchantProductType:
                type: string
                description: A classification or type assigned to this product by you.
              googleProductCategory:
                type: string
                description: >-
                  Indicates the category of the item based on the Google product
                  taxonomy.
              googleProductCategoryId:
                type: number
                description: Google product category ID.
              groupId:
                type: string
                description: An identifier used to group related items together.
              taxCategory:
                type: string
                description: Specifies the tax category applicable to this item.
              additionalDescription:
                type: string
                description: >-
                  Any additional descriptive information about this item not
                  covered elsewhere.
              productInfo:
                $ref: '#/components/schemas/productInfo'
    sessionUrls:
      type: object
      required:
        - return
        - cancel
        - webhook
      properties:
        return:
          type: string
          format: uri
          description: >-
            The URL to which the customer is redirected after successfully
            completing the payment process.
        cancel:
          type: string
          format: uri
          description: >-
            The URL to which the customer is redirected if they cancel the
            payment process before completion.
        webhook:
          type: string
          format: uri
          description: >-
            The URL endpoint on the merchant's server that receives asynchronous
            notifications about the outcome of the payment.
        appRedirect:
          type: string
          format: uri
          description: >-
            The URL used in Instanea payments to provide the merchant’s base app
            URL for redirection.
    billingAddress:
      type: object
      properties:
        streetName:
          type: string
          description: Street name of billing address.
        streetNumber:
          type: string
          description: Street number of billing address.
        addressLine2:
          type: string
          description: Address line 2 of billing address.
        addressLine3:
          type: string
          description: Address line 3 of billing address.
        city:
          type: string
          description: City of billing address.
        state:
          type: string
          description: State of billing address.
        country:
          type: string
          description: 3 character ISO country code of billing address.
        postalCode:
          type: string
          description: Postal code of billing address.
    shippingAddress:
      type: object
      title: address
      properties:
        firstName:
          type: string
          description: Shipping first name.
        lastName:
          type: string
          description: Shipping last name.
        companyName:
          type: string
          description: >-
            Shipping company name. Applicable, when the entity where the goods
            are being delivered is a business entity.
        streetName:
          type: string
          description: Shipping street.
        streetNumber:
          type: string
          description: Shipping street number.
        addressLine2:
          type: string
          description: Address line 2 of shipping address.
        addressLine3:
          type: string
          description: Address line 3 of shipping address.
        city:
          type: string
          description: Shipping city.
        state:
          type: string
          description: State of shipping address.
        country:
          type: string
          description: 3 character ISO country code of shipping address.
        postalCode:
          type: string
          description: Shipping postal code.
        phone:
          type: object
          description: Phone number associated with the shipping address.
          properties:
            countryCode:
              type: string
              description: Country Code/Area code of the phone number.
            number:
              type: string
              description: Phone number associated with the shipping address.
    shippingAddressCreatePayment:
      type: object
      title: shipping
      properties:
        address:
          allOf:
            - $ref: '#/components/schemas/shippingAddress'
            - type: object
        type:
          type: string
          description: Shipping method.
    customerInfo:
      type: object
      description: Information about the customer.
      required:
        - email
      properties:
        merchantCustomerId:
          type: string
          description: >-
            A unique identifier for the customer, assigned by the merchant's
            system.
        customerType:
          type: string
          description: Specifies the type of customer, such as "individual" or "business".
        firstName:
          type: string
          description: First name of the customer.
        lastName:
          type: string
          description: Last name (surname) of the customer.
        email:
          type: string
          description: Email address of the customer.
        phone:
          type: object
          description: Phone number of the customer.
          properties:
            countryCode:
              type: string
              description: Country Code/Area code of the phone number.
            number:
              type: string
              description: Phone number of the customer.
        salutation:
          type: string
          description: >-
            Salutation used to address the customer, such as "Mr", "Mrs", "Miss
            ".
        title:
          type: string
          description: >-
            Any additional title or designation associated with the customer,
            such as "Dr", etc.
        gender:
          type: string
          description: Gender of the customer.
        maidenName:
          type: string
          description: Maiden name of the customer.
        middleName:
          type: string
          description: Middle name of the customer.
        birthDate:
          type: string
          format: date
          description: Birth date of the customer in YYYY-MM-DD format.
        birthPlace:
          type: string
          description: Place of birth of the customer.
        socialSecurityNumber:
          type: string
          description: Customer's Social Security Number.
        taxId:
          type: string
          description: Tax identification number associated with the customer.
        companyName:
          type: string
          description: Name of the company if the customer is a business entity.
        positionOccupied:
          type: string
          description: Position or role occupied by the individual within their company.
        companyRegistrationNumber:
          type: string
          description: >-
            Official registration number of the company in its country of
            incorporation.
        companyVatId:
          type: string
          description: Value Added Tax (VAT) identification number for the company.
        companyLegalForm:
          type: string
          description: The legal form or structure of the company.
    accountInfo:
      type: object
      description: >-
        The account information contains optional information about the customer
        account with the merchant.
      properties:
        id:
          type: string
          description: >-
            The account ID of the cardholder within merchant environment /
            website (e.g. customer number).
        authenticationInfo:
          type: object
          properties:
            method:
              type: string
              description: >-
                This data element specifies the mechanism used by the Cardholder
                to authenticate to the merchant.
              enum:
                - GUEST
                - MERCHANT_CREDENTIALS
                - FEDERATED_ID
                - ISSUER_CREDENTIALS
                - THIRD_PARTY_AUTHENTICATION
                - FIDO
                - SIGNED_FIDO
                - SRC_ASSURANCE_DATA
            timestamp:
              type: string
              format: date-time
              description: >-
                Date and time (see RFC 3339) in UTC of the cardholder
                authentication. YYYY-MM-DDTHH:MM:SS+00:00.
            data:
              type: string
              description: >-
                This data element can carry specific authentication attestation
                data such as FIDO if applicable.
        ageIndicator:
          type: string
          description: >-
            Length of time that the customer has had the payment instrument /
            payment account with the merchant.
          enum:
            - GUEST_CHECKOUT
            - THIS_TRANSACTION
            - LESS_THAN_30_DAYS
            - FROM_30_TO_60_DAYS
            - MORE_THAN_60_DAYS
        changeDate:
          type: string
          format: date
          description: >-
            Date that the customer's payment instrument (account) with the
            merchant was last changed, including billing or shipping address,
            new payment account, or new user(s) added (YYYY-MM-DD).
        changeIndicator:
          type: string
          description: >-
            Length of time since the customer’s account information with the
            merchant was last changed, including billing or shipping address,
            new payment account, or new user(s) added.
          enum:
            - THIS_TRANSACTION
            - LESS_THAN_30_DAYS
            - FROM_30_TO_60_DAYS
            - MORE_THAN_60_DAYS
        creationDate:
          type: string
          format: date
          description: >-
            Date that the customer opened the account with the merchant in
            format YYYY-MM-DD.
        passwordChangeDate:
          type: string
          format: date
          description: >-
            Date that customer's account with the merchant had a password change
            or account reset in format YYYY-MM-DD.
        passwordChangeDateIndicator:
          type: string
          description: >-
            Indicates the length of time since the customer account had a
            password change or account reset.
          enum:
            - NO_CHANGE
            - THIS_TRANSACTION
            - LESS_THAN_30_DAYS
            - FROM_30_TO_60_DAYS
            - MORE_THAN_60_DAYS
        numberOfPurchases:
          type: number
          description: Number of purchases in the last 6 months
        addCardAttemptsDay:
          type: number
          description: Number of Add Card attempts in the last 24 hours.
        numberTransactionsDay:
          type: number
          description: >-
            Number of transactions (successful and abandoned) in the previous 24
            hours.
        numberTransactionsYear:
          type: number
          description: >-
            Number of transactions (successful and abandoned) in the previous
            year.
        paymentAccountAge:
          type: string
          format: date
          description: >-
            Date that the payment account was enrolled in the customer account
            in format YYYY-MM-DD.
        paymentAccountAgeIndicator:
          type: string
          description: >-
            Indicates the length of time that the payment account was enrolled
            in the customer account.
          enum:
            - GUEST_CHECKOUT
            - THIS_TRANSACTION
            - LESS_THAN_30_DAYS
            - FROM_30_TO_60_DAYS
            - MORE_THAN_60_DAYS
        shipAddressUsageDate:
          type: string
          format: date
          description: >-
            Date when the shipping address used for this transaction was first
            used in format YYYY-MM-DD.
        shipAddressUsageIndicator:
          type: string
          description: >-
            Indicates when the shipping address used for this transaction was
            first used.
          enum:
            - THIS_TRANSACTION
            - LESS_THAN_30_DAYS
            - FROM_30_TO_60_DAYS
            - MORE_THAN_60_DAYS
        suspiciousAccountActivity:
          type: boolean
          description: >-
            Indicates whether the merchant has experienced suspicious activity
            (including previous fraud) on the customer account.
    fraudData:
      type: object
      title: fraudData
      properties:
        accountInfo:
          $ref: '#/components/schemas/accountInfo'
        deliveryEmail:
          type: string
          description: >-
            For Electronic delivery, the email address to which the merchandise
            was delivered.
        deliveryTimeframe:
          type: string
          description: Indicates the merchandise delivery timeframe.
        giftCardAmount:
          type: number
          description: >-
            For prepaid or gift card purchase, the purchase amount total of
            prepaid or gift cards in smallest currency unit.
        giftCardCount:
          type: number
          description: >-
            For prepaid or gift card purchase, total count of individual prepaid
            or gift cards/codes purchased.
        giftCardCurrency:
          type: number
          description: >-
            For prepaid or gift card purchase, ISO 4217 three-digits numeric
            currency code of the gift card, e.g. 978.
        preOrderDate:
          type: string
          format: date
          description: >-
            For a pre-ordered purchase, the expected date that the merchandise
            will be available (YYYY-MM-DD).
        preOrderPurchaseIndicator:
          type: boolean
          description: >-
            Indicates whether customer is placing an order for merchandise with
            a future availability or release date.
        reorderItemsIndicator:
          type: boolean
          description: >-
            Indicates whether the customer is reordering previously purchased
            merchandise.
        shippingAddressIndicator:
          type: string
          description: >-
            Indicates shipping method chosen for the transaction. If one or more
            items are included in the sale, use the Shipping Indicator code for
            the physical goods, or if all digital goods, use the Shipping
            Indicator code that describes the most expensive item.
        ipZone:
          type: string
          description: >-
            Codes of countries from which you accept orders, 3 digits numeric
            according to ISO 3166-1. Separate several countries by commas:
            036,040,124.
        zone:
          type: string
          description: >-
            Codes of countries where you accept credit cards, 3 digits numeric
            or alphanumeric according to ISO 3166-1. Separate several countries
            by commas: 036,040,124.
    subMerchantPaymentFacilitator:
      type: object
      title: paymentFacilitator
      description: Object specifying SubMerchant (Payment Facilitator) details.
      properties:
        subMerchantId:
          type: string
          description: SubMerchantID assigned by the Payment Facilitator.
        subMerchantName:
          type: string
          description: Name of the SubMerchantID.
        subMerchantCity:
          type: string
          description: City of the SubMerchantID.
        subMerchantCountry:
          type: string
          description: >-
            Country code of the SubMerchantID according to ISO-3166-1,
            alphanumeric 2 chars.
        subMerchantStreet:
          type: string
          description: Street of the SubMerchantID.
        subMerchantZip:
          type: string
          description: Postcode of the SubMerchantID.
        subMerchantState:
          type: string
          description: State of the SubMerchantID.
    browserInfo:
      type: object
      properties:
        acceptHeaders:
          type: string
          description: >-
            Exact content of the HTTP accept headers as sent from the customer’s
            browser.
        ipAddress:
          type: string
          description: IP address of the browser as returned by the HTTP headers.
        javaEnabled:
          type: boolean
          description: >-
            Represents the ability of the customer's browser to execute Java.
            Required when Browser JavaScript Enabled = true; otherwise Optional.
        javaScriptEnabled:
          type: boolean
          description: >-
            Represents the ability of the customer's browser to execute
            JavaScript.
        language:
          type: string
          description: >-
            Value representing the browser language as defined in IETF BCP47,
            returned from navigator.language property, e.g. "en", "de", "fr",
            "en-US", "en-GB", "de-DE", "de-AT", etc.
        colorDepth:
          type: number
          description: >-
            Value representing the bit depth of the colour palette for
            displaying images, in bits per pixel. Required when Browser
            JavaScript Enabled = true; otherwise optional.
        screenHeight:
          type: number
          description: >-
            Total height of the Cardholder’s screen in pixels. Required when
            Browser JavaScript Enabled = true; otherwise optional.
        screenWidth:
          type: number
          description: >-
            Total width of the cardholder’s screen in pixels. Required when
            Browser JavaScript Enabled = true; otherwise optional.
        timeZoneOffset:
          type: string
          description: >-
            Time-zone offset in minutes between UTC and the Cardholder browser
            local time. Required when Browser JavaScript Enabled = true;
            otherwise optional.
        userAgent:
          type: string
          description: Exact content of the HTTP user-agent header.
    device:
      type: object
      properties:
        deviceId:
          type: string
          description: Unique Device-ID.
        deviceType:
          type: string
          enum:
            - DESKTOP
            - TABLET
            - SMARTPHONE
        deviceOs:
          type: string
          enum:
            - ANDROID
            - IOS
            - OTHERS
        confidence:
          type: number
          description: >-
            A numerical value that indicates the level of confidence in the
            identification or verification of the customer's device. 0=no
            allocation, 100=absolutely safe allocation.
        newDevice:
          type: boolean
          description: >-
            Indicates whether the device being used is new or has not been
            previously recognized by the system.
        isAnonymousProxyUsed:
          type: boolean
          description: >-
            Specifies whether the customer is using an anonymous proxy to mask
            their IP address.
        isProxyUsed:
          type: boolean
          description: Indicates whether any kind of proxy is being used by the customer.
        country:
          type: string
          description: The country associated with the device's IP address.
        city:
          type: string
          description: The city associated with the device's IP address.
        latitude:
          type: string
          description: The latitude coordinate of the device's location.
        longitude:
          type: string
          description: The longitude coordinate of the device's location.
        fraudScore:
          type: number
          description: >-
            A numerical score that indicates the likelihood of fraudulent
            activity associated with the device.
        fraudScoreRules:
          type: array
          description: >-
            A list or description of the rules or criteria that contributed to
            the fraud score calculation for the device.
          items:
            type: string
        browserLanguages:
          type: array
          description: >-
            A list of languages configured in the browser being used on the
            device.
          items:
            type: string
        isMobileDevice:
          type: boolean
          description: Indicates whether the device being used is a mobile device.
        fraud:
          type: string
          description: >-
            Indicates whether the device has been flagged as potentially
            fraudulent based on predefined criteria. e.g. fraud, suspicion,
            nofraud.
    alipay:
      type: object
      title: alipay
      x-alipay: true
      required:
        - account
      properties:
        account:
          type: object
          required:
            - accountHolderName
          properties:
            accountHolderName:
              type: string
              description: Name of account holder.
        hotelInfo:
          type: object
          properties:
            name:
              type: string
              description: >-
                Name of the hotel for which the reservation is for. Mandatory in
                case the merchant’s business type is Hotel.
            checkInTime:
              type: array
              description: >-
                Date of the check-in expressed in GMT+8, in format: YYYY-MM-DD.
                Mandatory in case the merchant’s business type is Hotel. In case
                of multiple entries, they should be separated by a ‘|’.
              items:
                type: string
                format: date-time
            checkOutTime:
              type: array
              description: >-
                Date of the check-out expressed in GMT+8, in format: YYYY-MM-DD.
                Mandatory in case the merchant’s business type is Hotel. In case
                of multiple entries, they should be separated by a ‘|’.
              items:
                type: string
                format: date-time
        sellingPoint:
          type: string
          description: Selling point.
        service:
          type: string
          description: Products or service sold.
    customFieldsCard:
      type: object
      title: customFields
      properties:
        customField1:
          type: string
          description: >-
            Customizable fields that can store additional data or display
            specific information on a card template.
        customField2:
          type: string
          description: >-
            Customizable fields that can store additional data or display
            specific information on a card template.
