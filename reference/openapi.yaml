    cloudPOSRequest:
      type: object
      title: CloudPosRequest
      required:
        - messageType
        - transId
        - posTerminalId
        - isPrinterReady
        - amount
        - localDateTime
      properties:
        transId:
          type: string
          description: >-
            Transaction ID created in your system. It should be unique for each
            payment.
        messageType:
          type: string
          description: >-
            Defines the type of payment: Supported values are: 01 - Sale; 02 -
            Reverse; 03 - Credit; 05 - Authorization/Reservation; 0B - Capture;
            0C - Card Read; 0D - Diagnose; A1 - Terminal Startup.
          enum:
            - SALE
            - REVERSE
            - CREDIT
            - AUTHORISATION_OR_RESERVATION
            - CAPTURE
            - CARD_READ
            - DIAGNOSE
            - TERMINAL_STARTUP
        refNr:
          type: string
          description: >-
            Your unique reference number for the specific operation. You can
            pass this value to reconcile different operations in a payment
            (authorization, capture, refund, etc) individually.
        amount:
          $ref: '#/components/schemas/amountMini'
        posTerminalId:
          type: string
          description: TerminalID of PIN entry device.
        cardReadMode:
          type: string
          description: >-
            Defines the technology to be used to read the card. Valid values
            are: msr.
          enum:
            - MSR
        localDateTime:
          type: string
          format: date-time
          description: Transaction date and time.
        traceNr:
          type: string
          description: >-
            Mandatory for subsequent functions Reversal or Capture
            (MessageType=02/08). It must be equal to the value traceNr received
            from the original authorization response. Merchant POS system must
            provide this in the request.
        approvalCode:
          type: string
          description: >-
            Mandatory for subsequent function Capture (MessageType=08). It must
            be equal to the value approvalCode received from the original
            authorization response. Merchant POS system must provide this in the
            request.
        credentialOnFile:
          $ref: '#/components/schemas/cloudPosCredentialOnFile'
        contractId:
          type: string
          description: >-
            Special merchant ID at the acquirer to overrule the default merchant
            ID.
