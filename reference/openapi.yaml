      type: object
      title: fraudData
      properties:
        zone:
          type: string
          description: >-
            If country codes have been entered in Zone Axepta Online returns the
            country code for the credit card or "UNKNOWN".
        ipZone:
          type: string
          description: >-
            If IP-countries are transmitted in IPZone in the case of the inquiry
            Axepta Online returns the country code of the IP address or
            "UNKNOWN".
        ipZoneA2:
          type: string
          description: >-
            If IPZone is submitted within the request Axepta Online returns the
            two-character country code of the IP address or "UNKNOWN".
            (DE=Germany, FR=France etc.)
        ipState:
          type: string
          description: >-
            If IPZone is submitted in the request Axepta Online returns the
            federal state from which the IP address of your customer originates.
        ipCity:
          type: string
          description: >-
            If IPZone is submitted in the request Axepta Online returns the
            town/city from which the IP address of your customer originates.
        ipLongitude:
          type: string
          description: >-
            If IPZone is submitted in the request Axepta Online returns the
            geographical longitude (floating point, decimal) of the dial-in node
            (PoP) of your customer.
        ipLatitude:
          type: string
          description: >-
            If IPZone is submitted in the request Axepta Online returns the
            geographical latitude (floating point, decimal) of the dial-in node
            (PoP) of your customer.
        fsStatus:
          type: string
          description: >-
            Only with EVO Payments International: ACCEPT=no suspicion of card
            fraud, DENY=refusal recommended, CHALLENGE= verification
            recommended, NOSCORE=No risk analysis, ENETFP=Exceptional error in
            the network, ERROR=Error in the data processing centre,
            ETMOUT=Timeout.
        fsCode:
          type: string
          description: >-
            Only with EVO Payments International: Recommended action: <0000> no
            result, <0100> accept, <0150> always accept, <0200> deny, <0250>
            always deny, <0300> suspicious, <0330> please check, <0400>
            suspicious ReD blacklist, <0500> questionable, <0600> questionable
            ReD blacklist, <0700> threshold exceeded, <0800> unusual usage,
            <901> intern ebitGuard error, <902> format error.
