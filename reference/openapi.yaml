  /{merchantBasicWebhookUrl}:
    post:
      tags:
        - Webhooks
      summary: Basic Webhook
      description: >-
        The payload contains only the unique Axepta Online payId. The merchant
        can use this value to call the Retrieve payment details by payment ID
        endpoint to obtain full transaction details.


        Since no sensitive data is transmitted, no HMAC signature is used for
        this Webhook type.


        When the merchant receives a webhook, their endpoint must respond with
        an HTTP status code to acknowledge successful processing.
      requestBody:
        description: >-
          This is a notification sent by Axepta Online about the final result of
          a payment.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requestBasicWebhooks'
            example:
              payId: 78f5adccfe8640e5a549613389ff33we
      responses:
        2XX:
          description: Successfully received and processed by merchant system
        4XX:
          description: Delivery will be retried according to Axepta Online retry policy
        5XX:
          description: Delivery will be retried according to Axepta Online retry policy
      parameters:
        - name: merchantBasicWebhookUrl
          in: path
          required: true
          schema:
            type: string
  /{merchantEnhancedWebhookUrl}:
    post:
      tags:
        - Webhooks
      summary: Enhanced Webhook
      description: >-
        The Enhanced Webhook includes detailed transaction data in the payload
        and is signed with an HMAC signature to ensure authenticity and
        integrity.
      requestBody:
        description: >-
          This is a notification sent by Axepta Online API about the final
          result of a payment.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requestEnhancedWebhooks'
            example:
              payId: 78f5adccfe8640e5a549613389ff33we
              transId: txn_7890
              refNr: '45687'
              status: OK
              responseCode: '00000000'
              responseDescription: success
              amount:
                value: 10000
                currency: EUR
              paymentMethods:
                - type: CARD
              creationDate: '2025-09-23T13:20:30Z'
      responses:
        2XX:
          description: Successfully received and processed by merchant system
        4XX:
          description: Delivery will be retried according to Axepta Online retry policy
        5XX:
          description: Delivery will be retried according to Axepta Online retry policy
      parameters:
        - name: merchantEnhancedWebhookUrl
          in: path
          required: true
          schema:
            type: string
