      type: object
      title: dcc
      description: >-
        Carries the customer’s DCC decision for integration type direct.
        Required when the customer opts into DCC.
      properties:
        selected:
          type: boolean
          description: >-
            Customer decision: true = opted in, false = opted out. Required if
            dcc object is present.
        dccRequestId:
          type: string
          description: Identifier of the DCC quote. Required if selected is true.
    card:
      type: object
      properties:
        eventToken:
          type: string
          description: >-
            Defines specific use cases of card payments, if applicable.

            - DELAYED_SHIPMENT: Passed in initial request, if you intend to
            capture the request after the shipment is sent.

            - PRE_AUTH: Passed in initial request, if the initial payment is a
            preauthorization.

            - PLBS: Passed in initial request, if the payment is related to
            rental of goods and services and is being initiated as a
            preauthorization.

            - ORDER: Pass if you want to perform authentication and payment in 2
            steps. If you pass it, then the payment should be confirmed by
            calling the Confirm payment endpoint.

            - REAUTHORIZATION: Passed in subsequent merchant initiated
            transaction. You can initiate a re-authorization when the

            completion or fulfillment of the original order or service extends
            beyond the authorization validity limit set by Visa.There

            are two common re-authorization scenarios:
              - Split or delayed shipments at eCommerce retailers. A split shipment occurs when not all the goods ordered are
              available for shipment at the time of purchase. If the fulfillment of the goods takes place after the authorization
              validity limit set by Visa, eCommerce merchants perform a separate authorization to ensure that consumer funds are
              available.
              - Extended stay hotels, car rentals, and cruise lines. A re-authorization is used for stays, voyages, and/or rentals that
              extend beyond the authorization validity period set by Visa.
            - RESUBMISSION: Passed in subsequent merchant initiated transaction.
            You perform a re-submission in cases where it requested an
            authorization, but received a decline due to insufficient funds;
            however, the goods or services were already delivered to the
            cardholder.
              In such scenarios you can resubmit the request to recover outstanding debt from cardholders.
            - DELAYED_CHARGES: Delayed charges are performed to process a
            supplemental account charge after original services have been
            rendered and respective payment has been processed.

            - NO_SHOW: Passed in subsequent merchant initated transaction.
            Cardholders can use their Visa cards to make a guaranteed
            reservation with certain merchant segments. A guaranteed reservation
            ensures that the reservation will be honored and allows you to
            perform a No Show transaction to charge the cardholder a penalty
            according to the your  cancellation policy.

            - ACCOUNT_VERIFICATION: Pass this if you want to verify card account
            without initiating a payment transaction. Amount is optional when
            this value is sent.

            - ADDITIONAL_CHARGES
          enum:
            - DELAYED_SHIPMENT
            - PRE_AUTH
            - PLBS
            - ORDER
            - REAUTHORIZATION
            - RESUBMISSION
            - DELAYED_CHARGES
            - NO_SHOW
            - ACCOUNT_VERIFICATION
            - ADDITIONAL_CHARGES
        subType:
          type: array
          description: >-
            Used to define the card payment methods that needs to be shown on
            the payment form. The values here override your default
            configuration at merchant level.
          items:
            type: string
            enum:
              - AIRPLUS
              - AMEX
              - ARGENCARD
              - AURA
              - BANCONTACT
              - CABAL
