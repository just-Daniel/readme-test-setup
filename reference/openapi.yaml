  /payments/{id}:
    patch:
      tags:
        - Payments
      summary: Update payment details
      description: Update details about existing payment.
      operationId: updatePaymentDetails
      parameters:
        - name: id
          in: path
          description: PayId assigned by Axepta Online in the initial request.
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: >-
            A unique key provided by you to ensure that a particular operation
            is not processed multiple times in case of retries.
