    bancontact:
      type: object
      x-bancontactPayMethod: true
      required:
        - account
      properties:
        sellingPoint:
          type: string
          description: Selling point.
        service:
          type: string
          description: Products or service sold.
        account:
          type: object
          required:
            - accountHolderName
          properties:
            accountHolderName:
              type: string
              description: Name of account holder
        checkoutToken:
          type: string
          description: >-
            Card Token that merchant should store and provide in request to
            subsequent actions like Bancontact Recurring or One-Click
            Payment.Unique identifier of a card linked to the merchant. Can be
            used in subsequent WIP transactions only if the initial transaction
            has succeeded.
        eventToken:
          type: string
          description: >-
            Defines specific use cases of card payments, if applicable.

            - PRE_AUTH: Passed in initial request, if the initial payment is a
            preauthorization.

            - PLBS: Passed in initial request, if the payment is related to
            rental of goods and services and is being initiated as a
            preauthorization.

            - ORDER: Pass if you want to perform authentication and payment in 2
            steps. If you pass it, then the payment should be confirmed by
            calling the Confirm payment endpoint.

            - ACCOUNT_VERIFICATION: Pass this if you want to verify card account
            without initiating a payment transaction. Amount is optional when
            this value is sent.
          enum:
            - PRE_AUTH
            - PLBS
            - ORDER
            - ACCOUNT_VERIFICATION
        template:
          type: object
          properties:
            name:
              type: string
              description: Template for Bancontact Credit Card form.
            customFields:
              $ref: '#/components/schemas/customFieldsCard'
