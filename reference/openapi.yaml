            Transaction ID created in your system. It should be unique for each
            payment.


            For iDEAL only a-z, A-Z, 0-9 characters are permitted and the length
            should be <= 24
          maxLength: 64
        externalIntegrationId:
          type: string
          description: External integration identifier
        refNr:
          type: string
          description: >-
            Your unique reference number for the specific operation. You can
            pass this value to reconcile different operations in a payment
            (authorization, capture, refund, etc) individually.
        amount:
          $ref: '#/components/schemas/amount'
