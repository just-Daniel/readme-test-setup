    cardHosted:
      type: object
      title: card
      properties:
        eventToken:
          type: string
          description: >-
            Defines specific use cases of card payments, if applicable.

            - DELAYED_SHIPMENT: Passed in initial request, if you intend to
            capture the request after the shipment is sent.

            - PRE_AUTH: Passed in initial request, if the initial payment is a
            preauthorization.

            - PLBS: Passed in initial request, if the payment is related to
            rental of goods and services and is being initiated as a
            preauthorization.

            - ORDER: Pass if you want to perform authentication and payment in 2
            steps. If you pass it, then the payment should be confirmed by
            calling the Confirm payment endpoint.

            - ACCOUNT_VERIFICATION: Pass this if you want to verify card account
            without initiating a payment transaction. Amount is optional when
            this value is sent.
          enum:
            - DELAYED_SHIPMENT
            - PRE_AUTH
            - PLBS
            - ORDER
            - ACCOUNT_VERIFICATION
        subType:
          type: array
          description: >-
            Used to define the card payment methods that needs to be shown on
            the payment form. The values here override your default
            configuration at merchant level.
          items:
            type: string
            enum:
              - AIRPLUS
              - AMEX
              - ARGENCARD
              - AURA
              - BANCONTACT
              - CABAL
              - CARTESBANCAIRES
              - CBN
              - CENCOSUD
              - COMFORTCARD
              - CUP
              - DANKORT
              - DINERS
              - DISCOVER
              - ELO
              - HIPERCARD
              - JCB
              - LASER
              - MAESTRO
              - MASTERCARD
              - NARANJA
              - RUPAY
              - SHOPPING
              - TOTAL
              - VISA
        threeDsPolicy:
          $ref: '#/components/schemas/threeDsPolicy'
        template:
          $ref: '#/components/schemas/templateCard'
        prefillInfo:
          $ref: '#/components/schemas/cardPrefillInfo'
        dccEnabled:
          type: boolean
          description: >-
            Defines DCC behavior: true - forces DCC eligibility check; false -
            disables DCC; omitted - the merchant’s default MAT configuration is
            applied.
