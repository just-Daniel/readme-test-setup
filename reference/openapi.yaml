          $ref: '#/components/schemas/paymentUrls'
        billingAddress:
          $ref: '#/components/schemas/billingAddress'
        shipping:
          $ref: '#/components/schemas/shippingAddressCreatePayment'
        statementDescriptor:
          type: string
          description: >-
            Short, clear description of the transaction that appears on the
            customer's statement.
        customerInfo:
          $ref: '#/components/schemas/customerInfo'
        partialPayment:
          type: boolean
          description: >-
            Defines if the payment is a partial payment. Possible values: true
            or false.
        expirationTime:
          type: string
          format: date-time
          description: Transaction expiry timestamp (UTC).
          example: '2025-02-07T16:00:00Z'
        fraudData:
          $ref: '#/components/schemas/fraudData'
        paymentFacilitator:
          $ref: '#/components/schemas/subMerchantPaymentFacilitator'
        browserInfo:
          $ref: '#/components/schemas/browserInfo'
        device:
          $ref: '#/components/schemas/device'
        channel:
          type: string
          description: >-
            Specifies the sales or interaction channel through which the
            transaction is initiated. Examples include "online", "in-store",
            "mobile app".
          enum:
            - ECOM
            - MOTO
            - APP
            - PAYBYLINK
            - POS
        metadata:
          type: object
          description: >-
            A collection of additional custom data provided by you to store
            extra information about the transaction. This is a set of JSON key
            value pairs passed by you. Axepta Online will return the data as it
            is in the response.
        referencePayId:
          type: string
          description: >-
            Payment ID referring to the previous related request. Only
            applicable for PFConnect Authorization and Subsequent card
            installment payments.
        paymentMethods:
          $ref: '#/components/schemas/payment'
    baseResponse:
      type: object
      title: BaseResponse
      properties:
        payId:
          type: string
          description: >-
            A unique identifier assigned by Axepta Online to the payment. This
            ID remains constant throughout the lifecycle of the payment and is
            used to track and reference the payment across all subsequent
            operations, such as authorization, capture, refund, or cancellation.
        merchantId:
          type: string
          description: Merchant ID assigned by Axepta Online.
        transId:
          type: string
          description: Transaction ID provided by you in the request.
        xId:
          type: string
          description: >-
            A unique identifier assigned by Axepta Online for each operation in
            the payment. For example: xId will be different for the
            authorization and capture operations of a payment whereas payId will
            be same.
        refNr:
          type: string
          description: Reference number provided by you in the request.
        status:
          type: string
          description: Status of the transaction.
