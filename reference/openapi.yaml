    threeDsPolicy:
      type: object
      description: >-
        Object specifying authentication policies and exemption handling
        strategies.
      properties:
        skip:
          type: string
          description: >-
            Indicates whether and under which conditions authentication should
            be skipped or performed as data share only (dataOnly). By default,
            all transactions and SCA exemptions will be requested through EMV
            3DS if not specified otherwise.
          enum:
            - THIS_TRANSACTION
            - OUT_OF_SCOPE
            - DATA_ONLY
        exemption:
          type: object
          properties:
            reason:
              type: string
              description: >-
                Specifies the reason for requesting an exemption from 3DS
                authentication.
              enum:
                - TRANSACTION_RISK_ANALYSIS
                - DELEGATE_AUTHORITY
                - LOW_VALUE
                - TRUSTED_BENEFICIARY
                - SECURE_CORPORATE_PAYMENT
            merchantFraudRate:
              type: number
              minimum: 1
              maximum: 99
              description: >-
                Merchant fraud rate in bps taking into account all Merchant
                sites and card volumes, calculated as per PSD2 RTS Article 19.
                The merchant fraud rate is optional and has to be calculated by
                the Acquirer.
        challengePreference:
          type: string
          description: Indicates the merchant's preference for a 3DS challenge.
          enum:
            - NO_PREFERENCE
            - NO_CHALLENGE
            - REQUEST_CHALLENGE
            - MANDATE_CHALLENGE
    templateCard:
