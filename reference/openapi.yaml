      type: object
      title: CloudPosResponse
      properties:
        merchantId:
          type: string
          description: Merchant ID assigned by Axepta Online.
        transId:
          type: string
          description: Your own transaction ID, which must be unique for each payment.
        payId:
          type: string
          description: >-
            A unique identifier assigned by Axepta Online to the payment. This
            ID remains constant throughout the lifecycle of the payment and is
            used to track and reference the payment across all subsequent
            operations, such as authorization, capture, refund, or cancellation.
        refNr:
          type: string
          description: Dealer reference number.
        posTerminalId:
          type: string
          description: Echoed from the request parameter.
        terminalId:
          type: string
          description: Terminal ID which is forwarded towards acquirer authorization host.
        status:
          type: string
          description: OK (URLSuccess) or FAILED (URLFailure).
        additionalResponseData:
          type: string
          description: >-
            Additional text which the operator’s processing system can send
            optionally in replies to payment/cutover requests.
        approvalCode:
          type: string
          description: >-
            Approval code from authorization host in the response message to the
            client. Only in case of successful credit card transactions.
            Merchant must save this value form the response and use it when
            referencing Capture subsequent action.
        traceNr:
          type: string
          description: >-
            Trace number. Merchant must save this value form the response and
            use it when referencing subsequent actions i.e Reverse, Capture.
        responseCode:
          type: string
          description: Response code of the transaction.
        responseDescription:
          type: string
          description: Response description associated with the response code.
        providerResponseCode:
          type: string
          description: Financial transaction Authorization Host response code (Payment).
        vuNr:
          type: string
          description: Acquirer Contract ID number on which the transaction was processed.
        receipt:
          $ref: '#/components/schemas/receipt'
        dcc:
          $ref: '#/components/schemas/dcc'
        aidParameters:
          type: string
          description: >-
            Authorisation parameters: if these are present, the authorisation
            parameters must be printed out on the terminal receipt in unpacked
            form as 10 hexadecimal numbers. Aid-parameters can contain up to 130
            characters for electronic cash payments.
        localDateTime:
          type: string
          format: date-time
          description: Transaction date and time.
        verificationCode:
          type: string
          description: >-
            Used authentication mode. Possible values: Signature; PIN; On
            consumer device; NoAuth.
        credentialOnFile:
          $ref: '#/components/schemas/cloudPosCredentialOnFile'
        contractId:
          type: string
          description: Echoed from the request parameter.
        paymentMethod:
          $ref: '#/components/schemas/paymentMethodsCloudPOS'
