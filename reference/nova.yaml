openapi: 3.1.0
info:
  title: DERMS
  description: >-
    NOVA endpoints enable DERMS to interact with OEMs on behalf of utility
    providers to facilitate managed charging program participation.
  version: 1.0.0
servers:
  - url: https://api-acceptance.elematics.com
    description: Acceptance
  - url: https://api.elematics.com
    description: Production
security:
  - apiKey: []
tags:
  - name: Webhooks
    description: Endpoints to manage webhook subscriptions
  - name: Managed Charging Programs
    description: Endpoints to manage available managed charging programs
  - name: Vehicle Control
    description: Endpoints to control vehicle charging
paths:
  /nova/webhooks:
    post:
      operationId: createWebhookSubscription
      tags:
        - Webhooks
      summary: Create a webhook subscription
      description: >-
        Registers and validates a webho ok subscription. For more information
        and guidance on creating a subscription, see
        [Webhooks](https://docs.elematics.com/v2.0/docs/webhooks).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscription'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_WEBHOOK_EVENT_TYPE:
                  value:
                    status: Error
                    error:
                      code: INVALID_WEBHOOK_EVENT_TYPE
                      message: >-
                        Unsupported webhook event type: [<eventType>]. Supported
                        options: [<supported options here>]
                INVALID_WEBHOOK_CALLBACK_URL:
                  value:
                    status: Error
                    error:
                      code: INVALID_WEBHOOK_CALLBACK_URL
                      message: >-
                        Invalid webhook callback URL: [<callbackUrl>]. Must be a
                        non-null, valid absolute URL with http or https scheme
                        and no user info
                WEBHOOK_CHALLENGE_INVALID_SIGNATURE:
                  value:
                    status: Error
                    error:
                      code: WEBHOOK_CHALLENGE_INVALID_SIGNATURE
                      message: >-
                        Webhook callback URL [<callbackUrl>] returned an invalid
                        challenge signature. Expected response format from your
                        callback URL: {"eventType":
                        "webhook.challenge.response", "payload":
                        {"encryptedChallenge": "<signature>"}} To compute the
                        signature: 1. Concatenate:
                        "<challenge>.<issuedatseconds>.<webhookid>" (fields from
                        the challenge payload, dot-separated) 2. Compute
                        HMAC-SHA256 using your API key value as the secret 3.
                        Base64-encode the resulting digest
                WEBHOOK_CHALLENGE_MALFORMED:
                  value:
                    status: Error
                    error:
                      code: WEBHOOK_CHALLENGE_MALFORMED
                      message: >-
                        Webhook callback URL returned a malformed challenge
                        response. Expected challenge response format:
                        {"eventType": "webhook.challenge.response", "event":
                        {"encryptedChallenge": "<signature>"}}
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                WEBHOOK_ALREADY_EXISTS:
                  value:
                    status: Error
                    error:
                      code: WEBHOOK_ALREADY_EXISTS
                      message: >-
                        Webhook already exists for this partner, callbackUrl,
                        eventType, and filters combination. Existing webhook id:
                        [<id>]
        '410':
          description: Gone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                WEBHOOK_CHALLENGE_EXPIRED:
                  value:
                    status: Error
                    error:
                      code: WEBHOOK_CHALLENGE_EXPIRED
                      message: >-
                        Webhook challenge for webhook [<callbackUrl>] has
                        expired. Please recreate the webhook to receive a new
                        challenge.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                WEBHOOK_CREATION_FAILED:
                  value:
                    status: Error
                    error:
                      code: WEBHOOK_CREATION_FAILED
                      message: Failed to create webhook
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                WEBHOOK_CHALLENGE_TIMEOUT:
                  value:
                    status: Error
                    error:
                      code: WEBHOOK_CHALLENGE_TIMEOUT
                      message: >-
                        Webhook callback URL [<callbackUrl>] did not respond in
                        time. Check the availability of the callback URL and try
                        to recreate the webhook.
                WEBHOOK_CHALLENGE_CONNECTION_FAILED:
                  value:
                    status: Error
                    error:
                      code: WEBHOOK_CHALLENGE_CONNECTION_FAILED
                      message: >-
                        Unable to connect to webhook callback URL
                        [<callbackUrl>]. Check the availability of the callback
                        URL and try to recreate the webhook.
                WEBHOOK_CHALLENGE_UPSTREAM_ERROR:
                  value:
                    status: Error
                    error:
                      code: WEBHOOK_CHALLENGE_UPSTREAM_ERROR
                      message: >-
                        Webhook callback URL [<callbackUrl>] returned error
                        status: [<statusCode>] body: [<body>]
    get:
      operationId: getWebhookSubscriptions
      tags:
        - Webhooks
      summary: Get webhook subscriptions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookListResponse'
  /nova/webhooks/{id}:
    delete:
      operationId: deleteWebhookSubscription
      tags:
        - Webhooks
      summary: Delete webhook subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: d4f2b71f-5006-4718-a09a-5d56f9f171d7
      responses:
        '204':
          description: No Content
  /nova/managed-charging-programs:
    get:
      operationId: dermsSearchManagedChargingPrograms
      tags:
        - Managed Charging Programs
      summary: Search managed charging programs
      description: >-
        Returns managed charging programs managed by the DERMS, optionally
        filtered by zip codes.
      parameters:
        - name: zips
          in: query
          required: false
          description: >-
            Optional list of zip codes to filter programs by. When provided,
            only programs whose eligible zips overlap with the given set are
            returned.
          schema:
            type: array
            items:
              type: string
              pattern: ^\d{5}$
          examples:
            singleZip:
              summary: Filter by a single zip code
              value:
                - '60601'
            multipleZips:
              summary: Filter by multiple zip codes
              value:
                - '60601'
                - '60602'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManagedChargingProgramDetailsResponse'
  /nova/managed-charging-programs/{id}:
    put:
      operationId: createManagedChargingProgram
      tags:
        - Managed Charging Programs
      summary: Test. Create or update a managed charging program
      description: >-
        Creates a managed charging program or updates an existing one that will
        be served to OEM users for enrollment.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: prog-a1b2c3d4-e5f6-7890-abcd-ef1234567890
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManagedChargingProgramRequest'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
    get:
      operationId: dermsGetManagedChargingProgram
      tags:
        - Managed Charging Programs
      summary: Get a managed charging program
      description: >-
        Returns the full details of a single managed charging program by its
        external ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: prog-a1b2c3d4-e5f6-7890-abcd-ef1234567890
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedChargingProgramDetailsResponse'
  /nova/managed-charging-programs/enrollments:
    post:
      operationId: createEnrollment
      tags:
        - Managed Charging Programs
      summary: Create a managed charging program enrollment
      description: >-
        Submits an enrollment application for a managed charging program on
        behalf of a set of vehicles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentApplicationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MANAGED_CHARGING_ENROLLMENT_FORM_VALIDATION_ERROR:
                  value:
                    status: Error
                    error:
                      code: MANAGED_CHARGING_ENROLLMENT_FORM_VALIDATION_ERROR
                      message: >-
                        [{"fieldName":"zipCode","errorType":"REQUIRED_FIELD_MISSING"}]
                VEHICLE_ADDRESS_NOT_ELIGIBLE_FOR_MANAGED_CHARGING_PROGRAM:
                  value:
                    status: Error
                    error:
                      code: >-
                        VEHICLE_ADDRESS_NOT_ELIGIBLE_FOR_MANAGED_CHARGING_PROGRAM
                      message: >-
                        Vehicle's address is not within program [<programId>]'s
                        eligible boundaries
                VEHICLE_COUNT_NOT_ELIGIBLE_FOR_MANAGED_CHARGING_PROGRAM:
                  value:
                    status: Error
                    error:
                      code: VEHICLE_COUNT_NOT_ELIGIBLE_FOR_MANAGED_CHARGING_PROGRAM
                      message: >-
                        Program [<programId>]'s supports max
                        [<maxVehiclesPerEnrollment>] vehicles per enrollment
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                DERMS_NOT_FOUND:
                  value:
                    status: Error
                    error:
                      code: DERMS_NOT_FOUND
                      message: No DERMS found for the provided API key
                MANAGED_CHARGING_PROGRAM_NOT_FOUND:
                  value:
                    status: Error
                    error:
                      code: MANAGED_CHARGING_PROGRAM_NOT_FOUND
                      message: >-
                        No managed charging program found for id:
                        [<externalProgramId>]
                USER_VIN_NOT_FOUND:
                  value:
                    status: Error
                    error:
                      code: USER_VIN_NOT_FOUND
                      message: User and VIN combination not found
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MANAGED_CHARGING_ALREADY_ENROLLED:
                  value:
                    status: Error
                    error:
                      code: MANAGED_CHARGING_ALREADY_ENROLLED
                      message: >-
                        One or more vehicles is already enrolled in managed
                        charging program [<programId>]
                MANAGED_CHARGING_APPLICATION_ALREADY_PENDING:
                  value:
                    status: Error
                    error:
                      code: MANAGED_CHARGING_APPLICATION_ALREADY_PENDING
                      message: >-
                        One or more vehicles already has a pending application
                        for managed charging program [<programId>]
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MANAGED_CHARGING_ENROLLMENT_FAILED:
                  value:
                    status: Error
                    error:
                      code: MANAGED_CHARGING_ENROLLMENT_FAILED
                      message: >-
                        Internal server error enrolling into managed charging
                        program: [<programId>]
  /nova/managed-charging-programs/enrollments/{enrollmentId}:
    patch:
      operationId: updateEnrollment
      tags:
        - Managed Charging Programs
      summary: Update enrollment status
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: d4f2b71f-5006-4718-a09a-5d56f9f171d7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentUpdateRequest'
            examples:
              accepted:
                value:
                  status: ACCEPTED
              rejected:
                value:
                  status: REJECTED
              requiresResubmission:
                value:
                  status: REQUIRES_RESUBMISSION
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MANAGED_CHARGING_INVALID_STATUS_TRANSITION:
                  value:
                    status: Error
                    error:
                      code: MANAGED_CHARGING_INVALID_STATUS_TRANSITION
                      message: >-
                        Cannot transition enrollment status from
                        [<currentStatus>] to [<newStatus>]
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                DERMS_NOT_FOUND:
                  value:
                    status: Error
                    error:
                      code: DERMS_NOT_FOUND
                      message: No DERMS found for the provided API key
                MANAGED_CHARGING_PROGRAM_ENROLLMENT_NOT_FOUND:
                  value:
                    status: Error
                    error:
                      code: MANAGED_CHARGING_PROGRAM_ENROLLMENT_NOT_FOUND
                      message: No managed charging program enrollment found.
  /nova/charge/command:
    post:
      operationId: chargeCommand
      tags:
        - Vehicle Control
      summary: Send a vehicle a charge command
      description: >-
        Sends a vehicle a realtime start or stop charge command.


        Note: A 200 does not guarantee the vehicle has physically responded. A
        vehicle.state.updated webhook may be triggered depending on the OEM,
        which can be used to verify adherence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeCommandRequest'
      responses:
        '200':
          description: OK
  /nova/charge/schedule:
    post:
      operationId: scheduleCharge
      tags:
        - Vehicle Control
      summary: Send a vehicle a charge schedule
      description: >-
        Delivers pre-computed charging window to be sent to the vehicle.


        Note: A 200 does not guarantee the vehicle has physically responded. A
        vehicle.state.updated webhook may be triggered depending on the OEM,
        which can be used to verify adherence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeScheduleRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeScheduleResponse'
components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          examples:
            - USER_NOT_FOUND
        message:
          type: string
          examples:
            - User not found
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          examples:
            - Error
        error:
          $ref: '#/components/schemas/Error'
    WebhookSubscription:
      type: object
      properties:
        callbackUrl:
          type: string
          format: uri
          examples:
            - https://api.example.com/vehicle-states
        eventType:
          type: string
          enum:
            - vehicle.charge_event
            - vehicle.state.updated
            - vehicle.enrollment.created
            - vehicle.enrollment.updated
    WebhookResponse:
      type: object
      properties:
        id:
          type: string
          examples:
            - d4f2b71f-5006-4718-a09a-5d56f9f171d7
      required:
        - id
    WebhookListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        dermsId:
          type: string
          format: uuid
        callbackUrl:
          type: string
          format: uri
          examples:
            - https://api.example.com/vehicle-states
        eventType:
          type: string
          enum:
            - vehicle.charge_event
            - vehicle.state.updated
            - vehicle.enrollment.created
            - vehicle.enrollment.updated
        filters:
          type: object
          properties:
            vins:
              type: array
              items:
                type: string
            vehicleStateEventTypes:
              type: array
              items:
                type: string
            partnerIds:
              type: array
              items:
                type: integer
        enabled:
          type: boolean
        challengeVerifiedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    WebhookListResponse:
      type: object
      properties:
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/WebhookListItem'
      required:
        - webhooks
    CreateManagedChargingProgramRequest:
      type: object
      required:
        - provider
        - name
        - enrollmentForm
        - eligibilityRequirements
        - programType
      properties:
        name:
          type: string
          examples:
            - Smart Charge Rewards (2026)
        provider:
          $ref: '#/components/schemas/ManagedChargingProgramProvider'
        programType:
          type: string
          enum:
            - ACTIVE
            - PASSIVE
            - DATA_ONLY
          examples:
            - ACTIVE
        marketing:
          $ref: '#/components/schemas/ManagedChargingProgramMarketing'
        contactDetails:
          $ref: '#/components/schemas/ManagedChargingProgramContactDetails'
        enrollmentForm:
          $ref: '#/components/schemas/ManagedChargingProgramEnrollmentForm'
        eligibilityRequirements:
          $ref: '#/components/schemas/ManagedChargingProgramEligibilityRequirements'
    ManagedChargingProgramProvider:
      type: object
      description: The utility, CCA, or state agency that offers managed charging programs.
      required:
        - id
        - name
      properties:
        id:
          type: string
          examples:
            - util-a1b2c3d4-e5f6-7890-abcd-ef1234567890
        name:
          type: string
          examples:
            - Cascadia Power & Light
    ManagedChargingProgramMarketing:
      type: object
      description: >-
        Marketing content for a managed charging program for display in the
        OEM's enrollment UI.
      required:
        - displayName
        - descriptionShort
        - descriptionLong
        - badgeUrl
        - heroUrl
      properties:
        displayName:
          type: string
          examples:
            - Smart Charge Rewards
        descriptionShort:
          type: string
          examples:
            - Earn bill credits by charging your EV during off-peak hours.
        descriptionLong:
          type: string
          examples:
            - >-
              Earn bill credits by charging your EV during off-peak hours.
              Enrolling in smart charge rewards can earn up to $10 in bill
              credits per month.
        badgeUrl:
          type: string
          format: uri
          examples:
            - https://cdn.example.com/badges/smart-charge.png
        badgeAltText:
          type: string
          examples:
            - Smart Charge Rewards badge
        heroUrl:
          type: string
          format: uri
          examples:
            - https://cdn.example.com/heroes/smart-charge.jpg
        heroAltText:
          type: string
          examples:
            - An EV plugged in at night
        learnMoreText:
          type: string
          examples:
            - Learn how you can save
        learnMoreUrl:
          type: string
          format: uri
          examples:
            - https://www.example.com/smart-charge-rewards
        benefits:
          type: array
          description: A benefit of enrolling in a managed charging program.
          items:
            $ref: '#/components/schemas/ManagedChargingProgramBenefit'
          default: []
    ManagedChargingProgramBenefit:
      type: object
      description: A benefit of enrolling in a managed charging program.
      required:
        - title
        - description
      properties:
        elematicsIcon:
          type: string
          examples:
            - material-symbols:bolt
        title:
          type: string
          examples:
            - Bill credits
        description:
          type: string
          examples:
            - Up to $10/month back on your utility bill.
    ManagedChargingProgramEnrollmentForm:
      type: object
      description: The definition of a managed charging program's enrollment form.
      properties:
        steps:
          type: array
          description: >-
            A top-level step in the enrollment form. In multi-page enrollment
            UIs, each step is rendered as a separate page. In single-page UIs,
            steps can be rendered as a collection of sections.

            A step can contain direct fields and/or sections that group related
            fields together. It's recommended that a given step either contain
            direct child fields or sections, but not both.

            The recommended default is to organize fields under sections. The
            exception is in multi-page enrollment UIs where a step contains only
            one logical section — in that case, fields should be elevated
            directly to the step level rather than wrapped in a section.
          items:
            $ref: '#/components/schemas/EnrollmentStep'
          default: []
    EnrollmentStep:
      type: object
      description: >-
        A top-level step in the enrollment form. In multi-page enrollment UIs,
        each step is rendered as a separate page. In single-page UIs, steps can
        be rendered as a collection of sections.

        A step can contain direct fields and/or sections that group related
        fields together. It's recommended that a given step either contain
        direct child fields or sections, but not both.

        The recommended default is to organize fields under sections. The
        exception is in multi-page enrollment UIs where a step contains only one
        logical section — in that case, fields should be elevated directly to
        the step level rather than wrapped in a section.
      required:
        - name
        - label
      properties:
        name:
          type: string
          examples:
            - enrollment
        label:
          type: string
          examples:
            - Enrollment
        coaching:
          type: array
          description: >-
            Optional step-level user coaching content. Coaching content should
            be rendered prominently above the step's fields and sections.

            Each element's `text` should be rendered space-delimited with the
            other elements.

            Each element in this array can be styled as static text (when
            `action` is omitted) or as clickable text (when `action` is
            included).
          items:
            $ref: '#/components/schemas/InlineText'
          default: []
        fields:
          type: array
          description: Step-level enrollment fields.
          items:
            $ref: '#/components/schemas/EnrollmentField'
          default: []
        sections:
          type: array
          description: Step-level enrollment sections.
          items:
            $ref: '#/components/schemas/EnrollmentSection'
          default: []
    EnrollmentSection:
      type: object
      description: >-
        A logical grouping of form fields within a step.

        Each section should be rendered as a visual group of fields in the OEM's
        enrollment UI.
      required:
        - name
        - label
        - fields
      properties:
        name:
          type: string
          examples:
            - personal-info
            - utility-account-info
        label:
          type: string
          examples:
            - Personal Information
            - Utility Account Information
        style:
          type: string
          enum:
            - DEFAULT
            - CARD
          description: >-
            Controls how the section is rendered. `DEFAULT` renders fields
            individually. `CARD` groups all fields in a single card.
        coaching:
          type: array
          description: >-
            Optional section-level user coaching content. Coaching content
            should be rendered prominently above this section's fields.

            Each element's `text` should be rendered space-delimited with the
            other elements.

            Each element in this array can be styled as static text (when
            `action` is omitted) or as clickable text (when `action` is
            included).
          items:
            $ref: '#/components/schemas/InlineText'
          default: []
        fields:
          type: array
          description: Section-level enrollment fields.
          items:
            $ref: '#/components/schemas/EnrollmentField'
    EnrollmentField:
      type: object
      description: >-
        A single enrollment field. Each field corresponds to a single user input
        in the OEM's enrollment UI.
      required:
        - name
        - inputType
        - label
        - isPII
      properties:
        name:
          type: string
          description: >-
            The unique name of this field.

            Used as the field's key when submitting enrollment data to to NOVA's
            enrollment submission endpoints:

            OEMs via `POST` `/vehicles/managed-charging-programs/enrollments`

            DERMS via `POST` `/nova/managed-charging-programs/enrollments`
          examples:
            - accountNumber
            - email
        inputType:
          type: string
          description: >-
            The type of user input expected for this field.

            This controls how the OEM renders the field in the enrollment UI.

            Enrollment form submission endpoints (e.g. POST
            `/vehicles/managed-charging-programs/enrollments`)

            expect string values for all field types except info_only,

            which should be rendered as a non-editable field and does not
            require a value to be submitted.

            info_only fields are useful for rendering implicitly-defined fields
            such as terms and conditions acceptance.
          enum:
            - text
            - email
            - tel
            - number
            - select
            - checkbox
            - info_only
          examples:
            - text
        label:
          type: string
          description: >-
            The label for the form field to be displayed in the OEM's enrollment
            UI.

            When `labelContent` is present, this value should not be rendered
            except as a reference to this `EnrollmentField` in an error message.

            (E.g., "Please enter a valid value for Utility Account Number")
          examples:
            - Utility Account Number
        placeholder:
          type: string
          description: Optional placeholder hint text displayed when the field is empty.
          examples:
            - 555-123-4567
        labelContent:
          type: array
          description: >-
            An optional array of rich text content pieces that can be rendered
            in lieu of the `label` field in the OEM's enrollment UI.

            Each element in this array can be styled as static text (when
            `action` is omitted) or as clickable text (when `action` is
            included).

            Each element's `text` should be rendered space-delimited with the
            other elements.

            This is especially useful for a `CHECKBOX`-typed `EnrollmentField`
            where the field's content includes a mix of both static text and one
            or more links (e.g. to T&Cs).

            For example: `[{"text": "I agree to the ", "style": "normal"},
            {"text": "terms and conditions", "style": "normal", "action":
            {"type": "OPEN_EXTERNAL", "url": "https://www.example.com/terms"}}]`
          items:
            $ref: '#/components/schemas/InlineText'
        isPII:
          type: boolean
        disabled:
          type: boolean
          description: Optional and unused. Planned for future use.
        options:
          type: array
          description: >-
            An optional array of selectable options for `SELECT`-typed
            `EnrollmentField`s.

            For `SELECT` fields, these options should be rendered as a dropdown
            menu.
          items:
            $ref: '#/components/schemas/FieldOption'
        validation:
          $ref: '#/components/schemas/FieldValidation'
          description: >-
            Validation rules for an EnrollmentField.

            These rules are used to validate user input in the OEM's enrollment
            UI before submission to NOVA's enrollment submission endpoints.
        autoComplete:
          type: string
          examples:
            - 'off'
    FieldOption:
      type: object
      description: An option for a `SELECT`-typed form field.
      required:
        - label
        - value
      properties:
        label:
          type: string
          examples:
            - Southern California Edison
        value:
          type: string
          examples:
            - sce
    FieldValidation:
      type: object
      description: >-
        Validation rules for an `EnrollmentField`.

        These rules are used to validate user input in the OEM's enrollment UI
        before submission to NOVA's enrollment submission endpoints.
      properties:
        required:
          type: boolean
          examples:
            - true
        minLength:
          type: object
          required:
            - value
            - message
          properties:
            value:
              type: integer
              examples:
                - 8
            message:
              type: string
              examples:
                - Must be at least 8 characters.
        maxLength:
          type: object
          required:
            - value
            - message
          properties:
            value:
              type: integer
              examples:
                - 20
            message:
              type: string
              examples:
                - Must be no more than 20 characters.
        patterns:
          type: array
          items:
            type: object
            required:
              - value
              - message
            properties:
              value:
                type: string
                description: ECMAScript Regex pattern as a string.
                examples:
                  - ^[0-9]+$
              message:
                type: string
                examples:
                  - Must contain only digits.
    ManagedChargingProgramEligibilityRequirements:
      type: object
      description: >-
        Eligibility requirements for a managed charging program. Used to
        validate enrollment applications.
      properties:
        zips:
          type: array
          description: >-
            The list of zip codes eligible for this managed charging program.
            Enrollment applications with zip codes not in this list will be
            rejected.
          items:
            type: string
            pattern: ^\d{5}$
          examples:
            - - '60601'
        vehicles:
          type: array
          description: Optional and unused. Planned for future use.
          items:
            $ref: '#/components/schemas/VehicleEligibility'
        maxVehiclesPerEnrollment:
          type: integer
          description: >-
            Maximum number of vehicles allowed per enrollment. Defaults to no
            limit if not specified.
          examples:
            - 10000
    VehicleEligibility:
      type: object
      description: Optional and unused. Planned for future use.
      required:
        - make
        - model
        - year
      properties:
        make:
          type: string
          examples:
            - Make
        model:
          type: string
          examples:
            - Model
        year:
          type: integer
          examples:
            - 2026
    InlineTextStyle:
      type: string
      enum:
        - normal
        - bold
        - italic
    InlineText:
      type: object
      description: >-
        A piece of text with optional styling and an optional action that can be
        rendered in the OEM's enrollment UI.

        When `action` is omitted, the text is intended to be styled as
        non-clickable informational text.

        When `action` is included, the text is intended to be styled as
        clickable and the UI should trigger the specified action when the user
        clicks on it.
      required:
        - text
      properties:
        text:
          type: string
          examples:
            - Charging between 9pm and 7am earns the most credits.
        style:
          $ref: '#/components/schemas/InlineTextStyle'
        action:
          $ref: '#/components/schemas/InlineTextAction'
          description: >-
            An action associated with a piece of inline text that can be
            triggered in the OEM's enrollment UI when the user clicks on the
            text.
    InlineTextAction:
      type: object
      description: >-
        An action associated with a piece of inline text that can be triggered
        in the OEM's enrollment UI when the user clicks on the text.

        When `type` is marked `OPEN_PANEL`, the UI should render a panel with
        the specified `content` and `target` it according to the `target` field
        when the user clicks on the text.

        When `type` is marked `NAVIGATE`, the UI should navigate to the
        specified `route` within the OEM's app when the user clicks on the text.

        When `type` is marked `OPEN_EXTERNAL`, the UI should open a new browser
        tab with the specified `url` when the user clicks on the text.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - OPEN_PANEL
            - NAVIGATE
            - OPEN_EXTERNAL
        target:
          type: string
          description: >-
            Panel target for OPEN_PANEL actions. Currently only supports
            `BOTTOM_SHEET`, but can be extended in the future to support
            additional panel types and placements.
          enum:
            - BOTTOM_SHEET
        content:
          $ref: '#/components/schemas/PanelContent'
          description: >-
            Content to be rendered in a panel when an OPEN_PANEL action is
            triggered.
        route:
          type: string
          description: Route for NAVIGATE actions.
        url:
          type: string
          format: uri
          description: URL for OPEN_EXTERNAL actions.
    PanelContent:
      type: object
      description: >-
        Content to be rendered in a panel when an OPEN_PANEL action is
        triggered.
      required:
        - name
        - title
      properties:
        name:
          type: string
          description: A unique identifier for the content to be rendered in the panel
          examples:
            - find-account-holder
        title:
          type: string
          description: Title to be displayed at the top of the panel
          examples:
            - How do I know who my utility account holder is?
        paragraphs:
          type: array
          description: Paragraphs of text to be displayed in the panel body
          items:
            type: string
          default: []
        image:
          $ref: '#/components/schemas/ContentImage'
          description: >-
            An image to be displayed in a panel, with required alt text for
            accessibility and optional description text.
    ContentImage:
      type: object
      description: >-
        An image to be displayed in a panel, with required alt text for
        accessibility and optional description text.
      required:
        - title
        - url
      properties:
        title:
          type: string
          examples:
            - Example Bill
        url:
          type: string
          format: uri
          examples:
            - https://images.btr.energy/demo-assets/account-holder.png
        altText:
          type: string
          examples:
            - Screenshot of energy bill
        description:
          type: array
          items:
            $ref: '#/components/schemas/InlineText'
    ManagedChargingProgramContactDetails:
      type: object
      description: >-
        Contact details for a managed charging program that can be rendered in
        the OEM's enrollment UI.
      properties:
        contacts:
          type: array
          description: At least one of email, phone, or url must be provided.
          items:
            $ref: '#/components/schemas/ManagedChargingProgramContact'
          default: []
    ManagedChargingProgramContact:
      type: object
      required:
        - name
      description: At least one of email, phone, or url must be provided.
      properties:
        name:
          type: string
          examples:
            - Customer Support
        description:
          type: string
          examples:
            - For questions about your enrollment
        email:
          type: string
          format: email
          examples:
            - support@example.com
        phone:
          type: string
          examples:
            - +1-800-555-0199
        url:
          type: string
          format: uri
          examples:
            - https://www.example.com/support
      anyOf:
        - required:
            - email
        - required:
            - phone
        - required:
            - url
    ManagedChargingProgramDetailsResponse:
      type: object
      description: >-
        Full details of a managed charging program, including its DERMS,
        provider, marketing, enrollment form, and eligibility requirements.
      properties:
        derms:
          $ref: '#/components/schemas/DermsResponse'
          description: >-
            The DERMS (Distributed Energy Resource Management System) that
            manages the program.
        program:
          $ref: '#/components/schemas/ManagedChargingProgramResponse'
          description: A managed charging program that has been configured by a DERMS.
        provider:
          $ref: '#/components/schemas/ManagedChargingProgramProviderResponse'
          description: >-
            The provider (utility, CCA, or state agency) associated with a
            managed charging program.
        marketing:
          $ref: '#/components/schemas/ManagedChargingProgramMarketing'
          description: >-
            Marketing content for a managed charging program to be displayed in
            the OEM's enrollment UI.
        enrollmentForm:
          $ref: '#/components/schemas/ManagedChargingProgramEnrollmentForm'
          description: The definition of a managed charging program's enrollment form.
        requirements:
          $ref: '#/components/schemas/ManagedChargingProgramEligibilityRequirements'
          description: >-
            Eligibility requirements for a managed charging program. Used to
            validate enrollment applications.
      required:
        - program
    DermsResponse:
      type: object
      description: >-
        The DERMS (Distributed Energy Resource Management System) that manages
        the program.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - id
        - name
    ManagedChargingProgramResponse:
      type: object
      description: A managed charging program that has been configured by a DERMS.
      properties:
        id:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        dermsId:
          type: string
          format: uuid
        externalId:
          type: string
          description: The DERMS-assigned external program ID.
        name:
          type: string
        programType:
          type: string
          enum:
            - ACTIVE
            - PASSIVE
            - DATA_ONLY
        contactDetails:
          $ref: '#/components/schemas/ManagedChargingProgramContactDetails'
          description: >-
            Contact details for a managed charging program that can be rendered
            in the OEM's enrollment UI.
      required:
        - id
        - providerId
        - dermsId
        - externalId
        - name
        - programType
    ManagedChargingProgramProviderResponse:
      type: object
      description: >-
        The provider (utility, CCA, or state agency) associated with a managed
        charging program.
      properties:
        id:
          type: string
          format: uuid
        dermsId:
          type: string
          format: uuid
        externalId:
          type: string
        name:
          type: string
      required:
        - id
        - dermsId
        - externalId
        - name
    CreateEnrollmentRequest:
      type: object
      required:
        - programId
        - vins
        - enrollmentForm
        - status
      properties:
        programId:
          type: string
          description: External program ID
          examples:
            - prog-a1b2c3d4-e5f6-7890-abcd-ef1234567890
        vins:
          type: array
          items:
            type: string
            minLength: 17
            maxLength: 17
          uniqueItems: true
          examples:
            - - 1BTRNRGY2PA000001
        enrollmentForm:
          type: array
          items:
            $ref: '#/components/schemas/ManagedChargingEnrollmentFieldValue'
        validateForm:
          type: boolean
          default: false
          description: >-
            Whether to validate each enrollment form's fields against its
            respective validation rules.

            Only a DERMS can set this to false.
        enforceGeographicRestrictions:
          type: boolean
          default: false
          description: >-
            Whether to enforce geographic restrictions (e.g. utility service
            territory postal codes) for the enrollment.

            Only a DERMS can set this to false.
        status:
          type: string
          default: PENDING
          description: Initial enrollment status. Only DERMS can set this ACCEPTED.
          enum:
            - ACCEPTED
            - PENDING
          examples:
            - PENDING
    ManagedChargingEnrollmentFieldValue:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          examples:
            - accountNumber
            - firstName
        value:
          type: string
          description: >-
            Value provided by the user for the enrollment field. Must be a
            string, but can represent other data types (e.g. boolean, number)
            depending on the field's validation rules.
          examples:
            - '12345678'
            - Jane
    EnrollmentApplicationResponse:
      type: object
      required:
        - id
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          examples:
            - d4f2b71f-5006-4718-a09a-5d56f9f171d7
        status:
          type: string
          enum:
            - ACCEPTED
            - PENDING
          examples:
            - PENDING
        createdAt:
          type: string
          format: date-time
          examples:
            - '2026-03-01T10:10:00Z'
    EnrollmentUpdateRequest:
      type: object
      properties:
        status:
          type: string
          enum:
            - ACCEPTED
            - UNENROLLED
            - PENDING
            - REJECTED
            - REQUIRES_RESUBMISSION
      required:
        - status
    ChargeCommandRequest:
      type: object
      properties:
        vin:
          type: string
          minLength: 17
          maxLength: 17
          examples:
            - 1BTRNRGY2PA000001
        command:
          type: string
          enum:
            - START
            - STOP
      required:
        - vin
        - command
    ChargeScheduleRequest:
      type: object
      properties:
        vin:
          type: string
          minLength: 17
          maxLength: 17
          examples:
            - 5VBBA67A0MA121528
        readyByTime:
          type: string
          format: date-time
          description: The deadline by which the vehicle should reach targetSoc.
          examples:
            - '2026-03-02T07:00:00Z'
        targetSoc:
          type: number
          minimum: 0
          maximum: 100
          description: Desired state of charge percentage by readyByTime.
          examples:
            - 90
        windows:
          type: array
          description: Pre-computed charging windows to deliver to the OEM.
          minItems: 1
          items:
            $ref: '#/components/schemas/ChargeWindow'
      required:
        - vin
        - windows
    ChargeWindow:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
          description: Start of this charging window.
          examples:
            - '2026-03-01T23:00:00Z'
        endTime:
          type: string
          format: date-time
          description: End of this charging window. Must be after startTime.
          examples:
            - '2026-03-02T01:30:00Z'
      required:
        - startTime
        - endTime
    ChargeScheduleResponse:
      type: object
      properties:
        scheduleId:
          type: string
          examples:
            - sch-9d02cc14-88ba-4e10-b310-ff7743210099
        vin:
          type: string
          minLength: 17
          maxLength: 17
          examples:
            - 5VBBA67A0MA121528
        createdAt:
          type: string
          format: date-time
          examples:
            - '2026-03-01T10:10:00Z'
        status:
          type: string
          enum:
            - SCHEDULED
          examples:
            - SCHEDULED
      required:
        - scheduleId
        - vin
        - createdAt
        - status
    Vehicle:
      type: object
      properties:
        vin:
          type: string
          examples:
            - 1BTRNRGY2PA000001
        vehicleType:
          type: string
          enum:
            - BEV
            - PHEV
        make:
          type: string
          examples:
            - Make
        model:
          type: string
          examples:
            - Model
        year:
          type: integer
          examples:
            - 2025
        batterySizeWh:
          type: integer
          examples:
            - 63000
        mpge:
          type: integer
          examples:
            - 101
        ownershipStart:
          type: string
          format: date-time
          examples:
            - '2025-08-01T12:00:00Z'
      required:
        - vin
        - vehicleType
        - make
        - model
        - year
        - batterySizeWh
        - mpge
    VehicleChargeEvent:
      type: object
      properties:
        vin:
          type: string
          minLength: 17
          maxLength: 17
          description: VIN of charged vehicle
          examples:
            - 1BTRNRGY2PA000001
        eventStart:
          type: string
          format: date-time
          description: >-
            ISO 8601 date time string with a time zone representing the start of
            the Charge Event (UTC)
          examples:
            - '2025-05-01T22:33:41Z'
        eventEnd:
          type: string
          format: date-time
          description: >-
            ISO 8601 date time string with a time zone representing the end of
            the Charge Event (UTC)
          examples:
            - '2025-05-02T13:01:12Z'
        latitude:
          type: number
          format: double
          description: Double representing the latitude the Charge Event occurred
          examples:
            - 40.1234
        longitude:
          type: number
          format: double
          description: Double representing the longitude the Charge Event occurred
          examples:
            - -80.1234
        currentSoc:
          type: number
          format: double
          minimum: 0
          maximum: 100
          examples:
            - 60.5
        wattHours:
          type: number
          description: Watt hours for the Charge Event
          examples:
            - 21131
        milesAdded:
          type: number
          description: >-
            The range added in miles. Optional. If omitted, Elematics will
            calculate the range added based on the vehicle battery size and
            difference in state of charge.
          examples:
            - 76.2
      required:
        - vin
        - eventStart
        - eventEnd
        - latitude
        - longitude
        - wattHours
  responses:
    SuccessResponse:
      description: A successful response
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                examples:
                  - Success
            required:
              - status
