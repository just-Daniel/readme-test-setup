                    apk_48040241-OqCWOKczcjutZaFRSfTlVBDpHFXpkdzz<br> <br>
                    Utilizado para identificar o vendedor
                token:
                  type: string
                  description: >-
                    Token individual para cada vendedor. Ele é utilizado para
                    validar a solicitação e não deve ser compartilhado com
                    terceiros.<br><br>Para  obter o
                    token:<br>https://www.paghiper.com/painel/token/
                status:
                  type: string
                  description: "Listar as transa&ccedil;&otilde;es de acordo com o seu status atual<br /><br /> Esperado:<table class=\"especificacoesmini\"> <thead> <tr> <th>status</th> <th>significado</th> </tr> </thead> <tbody> <tr> <td>pending</td> <td>aguardando</td> </tr>   <tr> <td>reserved</td>   <td>reservado <a target=\"_blank\" href=\"https://atendimento.paghiper.com/hc/pt-br/articles/360016177713\">(Como Funciona ?)</a></td> \t</tr> \t <tr> <td>canceled</td> <td>cancelado</td> </tr> <tr> <td>paid</td> <td>aprovado e completo</td> </tr> <tr> <td>processing</td> <td>analise</td> </tr> <tr> <td>refunded</td> <td>estornado</td> </tr> </table> </tbody>"
                initial_date:
                  type: string
                  description: >-
                    Data inicial do filtro <br /><br />Exemplo esperado <br
                    />2018-01-01 <br /><br />Caso n&atilde;o seja enviado esse
                    par&acirc;metro, ser&aacute; utilizado os &uacute;ltimos 90
                    dias. <br /><br />Verifique as orienta&ccedil;&otilde;es do
                    par&acirc;metro: <br /><strong>filter_date</strong>
                  format: date
                final_date:
                  type: string
                  description: >-
                    Data inicial do filtro <br /><br />Exemplo esperado <br
                    />2018-01-01 <br /><br />Caso n&atilde;o seja enviado esse
                    par&acirc;metro, ser&aacute; utilizado a data
                    atual.&nbsp;<br /><br />Verifique as
                    orienta&ccedil;&otilde;es do par&acirc;metro: <br
                    /><strong>filter_date</strong>
                  format: date
                filter_date:
                  type: string
                  description: >-
                    * Campo obrigat&oacute;rio caso utilize o
                    <strong>initial_date</strong> e <strong>final_date</strong>
                    <br />Este par&acirc;metro tem a fun&ccedil;&atilde;o de
                    filtrar a busca de datas por:<br /><br />&bull; Data em que
                    a transa&ccedil;&atilde;o foi criada,<br /> &bull; Data em
                    que a transa&ccedil;&atilde;o foi paga<br />ou<br />&bull;
                    Data em que vence a transa&ccedil;&atilde;o<br /><br
                    />Esperado:<br><br><table class="especificacoesmini">
                    <thead> <tr> <th>op&ccedil;&otilde;es</th>
                    <th>significado</th> </tr> </thead> <tbody> <tr>
                    <td>create_date</td> <td>Data da cria&ccedil;&atilde;o</td>
                    </tr> <tr> <td>paid_date</td> <td>Data do pagamento</td>
                    </tr> <tr> <td>due_date</td> <td>Data do vencimento</td>
                    </tr> </tbody> </table>
                due_date:
                  type: string
                  description: >-
                    Data de vencimento do boleto <br><br>Exemplo esperado
                    2018-01-17  <br><br>Utilizado apenas para listar boletos que
                    irão vencer em uma determinada data.
                  format: date
                payer_cpf_cnpj:
                  type: string
                  description: >-
                    <strong>CPF ou CNPJ do pagador</strong><br /><br
                    />&Uacute;til para buscar os pedidos/boleto de um cliente
                    especifico através do CPF ou CNPJ
                order_id:
                  type: string
                  description: >-
                    <strong>C&oacute;digo de refer&ecirc;ncia da
                    venda</strong><br /><br /> C&oacute;digo para referenciar o
                    pagamento ou o n&uacute;mero do pedido <br /><br
                    />&Uacute;til para buscar o pagamento de um pedido criado
                    pelo sistema do lojista, caso o n&uacute;mero do pedido
                    tenha v&iacute;nculo com este par&acirc;metro.
                value_cents:
                  type: integer
                  description: >-
                    Possibilidade de buscar pelo valor da
                    transa&ccedil;&atilde;o<br /><br /> Valor unit&aacute;rio em
                    centavos<br /> Exemplo:Filtrar transa&ccedil;&otilde;es com
                    o valor de R$ 1.000,00 (mil reais), dever&aacute; ser
                    informado: 100000 (total em centavos)
                  format: int32
                value_cents_filter:
