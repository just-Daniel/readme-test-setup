                    <strong>value_cents</strong> <br><br>O uso desse
                    par&acirc;metro auxiliaria por exemplo a listar todas as
                    transa&ccedil;&otilde;es de valores menores ou iguais (
                    &lt;= ) &aacute; R$ 1000,00 (mil reais). <br><br>Esperado:
                    <br><br> <table class="especificacoesmini"> <thead> <tr>
                    <th>s&iacute;mbolo</th> <th>significado</th> </tr> </thead>
                    <tbody> <tr> <td>=</td> <td>Igual</td> </tr> <tr>
                    <td>&gt;=</td> <td>Maior igual</td> </tr> <tr>
                    <td>&lt;=</td> <td>Menor igual</td> </tr> <tr> <td>&gt;</td>
                    <td>Maior</td> </tr> <tr> <td>&lt;</td> <td>Menor</td> </tr>
                    </tbody> </table>
                limit:
                  type: integer
                  description: >-
                    Limita o n&uacute;mero m&aacute;ximo de
                    transa&ccedil;&otilde;es retornadas a no m&aacute;ximo 100
