  /transaction/list/:
    post:
      summary: Listar transações via API
      description: ''
      operationId: listar-transacoes-via-api-exemplo
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - apiKey
                - token
              properties:
                apiKey:
                  type: string
